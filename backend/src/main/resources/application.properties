spring.application.name=vitalpass-backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vitalpass}
spring.data.mongodb.auto-index-creation=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${SERVER_PORT:8080}
server.error.include-message=always

ai.gemini.key=${GEMINI_API_KEY:}
ai.gemini.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent}
ai.huggingface.key=${HUGGINGFACE_API_KEY:}
ai.huggingface.url=${HUGGINGFACE_API_URL:https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2}
ai.huggingface.whisper.url=${HUGGINGFACE_WHISPER_URL:https://api-inference.huggingface.co/models/openai/whisper-large-v3}
ai.gemini.voice.model=${GEMINI_VOICE_MODEL:gemini-1.5-flash}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Default value is a valid base64-encoded 32-byte key for local development.
jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@vitalpass.com}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.mediscan=${LOG_LEVEL_MEDISCAN:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}